databases:
  - name: llm-calc-db
    databaseName: llmcalc
    user: llmcalc
    plan: basic-256mb

services:
  - type: web
    name: llm-inference-calculator
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Fill these in the Render dashboard after the service is created.
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: llm-calc-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false